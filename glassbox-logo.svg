<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Face fills — very subtle so the glass feels transparent -->
    <linearGradient id="gTop" x1="50" y1="8" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#a8d4f8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4b7fd6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="gLeft" x1="8" y1="30" x2="50" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#3a6bc0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2550a0" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="gRight" x1="92" y1="30" x2="50" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6298e0" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#3a6bc0" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Edge highlight gradient (top face gets brighter edge) -->
    <linearGradient id="gEdgeTop" x1="8" y1="30" x2="92" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7ab8f8" stop-opacity="0.60"/>
      <stop offset="50%"  stop-color="#a8d4ff" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#7ab8f8" stop-opacity="0.60"/>
    </linearGradient>

    <!-- Soft glow on the outer cube shape -->
    <filter id="cubeGlow" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Node glow -->
    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ── Cube face fills ───────────────────────────────────────────── -->
  <polygon points="50,8 92,30 50,52 8,30"   fill="url(#gTop)"/>
  <polygon points="8,30 50,52 50,94 8,72"   fill="url(#gLeft)"/>
  <polygon points="50,52 92,30 92,72 50,94" fill="url(#gRight)"/>

  <!-- ── Cube edges ────────────────────────────────────────────────── -->
  <g filter="url(#cubeGlow)">
    <!-- Top face — brightest edges -->
    <polyline points="50,8 92,30 50,52 8,30 50,8"
      stroke="url(#gEdgeTop)" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Vertical center seam -->
    <line x1="50" y1="52" x2="50" y2="94"
      stroke="#6aa4e8" stroke-width="1.6"/>
    <!-- Left vertical edge -->
    <line x1="8"  y1="30" x2="8"  y2="72"
      stroke="#5a94d8" stroke-width="1.5"/>
    <!-- Right vertical edge -->
    <line x1="92" y1="30" x2="92" y2="72"
      stroke="#5a94d8" stroke-width="1.5"/>
    <!-- Bottom edges -->
    <polyline points="8,72 50,94 92,72"
      stroke="#5a94d8" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- ── Tree (nodes + connections) ───────────────────────────────── -->
  <!-- Drawn with a glow layer first, then the crisp strokes on top -->

  <!-- Connection lines — drawn before nodes so nodes sit on top -->
  <g stroke="#6aacec" stroke-linecap="round" opacity="0.9">
    <!-- Root → left child -->
    <line x1="47"  y1="41"  x2="31"  y2="55"  stroke-width="1.4"/>
    <!-- Root → right child -->
    <line x1="53"  y1="41"  x2="68"  y2="55"  stroke-width="1.4"/>
    <!-- Left child → left-left -->
    <line x1="27"  y1="61"  x2="19"  y2="73"  stroke-width="1.2"/>
    <!-- Left child → left-right -->
    <line x1="33"  y1="62"  x2="41"  y2="73"  stroke-width="1.2"/>
    <!-- Right child → lower right (toward badge) -->
    <line x1="71"  y1="61"  x2="74"  y2="68"  stroke-width="1.2"/>
  </g>

  <!-- Nodes with glow -->
  <g filter="url(#nodeGlow)">
    <!-- Root -->
    <circle cx="50" cy="37" r="5"   stroke="#96ccff" stroke-width="2.0" fill="rgba(75,127,214,0.18)"/>
    <!-- Left child -->
    <circle cx="29" cy="58" r="4.2" stroke="#82beef" stroke-width="1.8" fill="rgba(75,127,214,0.14)"/>
    <!-- Right child -->
    <circle cx="70" cy="58" r="4.2" stroke="#82beef" stroke-width="1.8" fill="rgba(75,127,214,0.14)"/>
    <!-- Left-left grandchild -->
    <circle cx="18" cy="76" r="3.5" stroke="#72b0e8" stroke-width="1.6" fill="rgba(75,127,214,0.10)"/>
    <!-- Left-right grandchild -->
    <circle cx="42" cy="76" r="3.5" stroke="#72b0e8" stroke-width="1.6" fill="rgba(75,127,214,0.10)"/>
  </g>

  <!-- ── Checkmark badge ───────────────────────────────────────────── -->
  <!-- Drop shadow -->
  <circle cx="77" cy="68" r="10.5" fill="rgba(0,0,0,0.25)"/>
  <!-- Badge fill -->
  <circle cx="77" cy="67" r="10"   fill="#3b6dbf"/>
  <!-- Badge highlight (top arc) -->
  <path d="M 69 63 A 10 10 0 0 1 85 63"
    stroke="rgba(255,255,255,0.22)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Check mark -->
  <polyline points="72,67 75.5,70.5 82,62.5"
    stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
